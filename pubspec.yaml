name: ebook_studio
description: 跨平台电子书阅读与知识管理软件 — Flutter 版（设计文档第三部分）
publish_to: "none"
version: 0.10.0

environment:
  sdk: ">=3.8.0 <4.0.0"
  # 设计文档 3.1 推荐 3.38+（桌面端全 Stable）；本地验证环境为 3.35.5，
  # 本项目未使用 3.38 专属 API，故放宽下限以便 CI/本地都能构建。
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  # PDF 渲染（设计文档 3.2：PDFium FFI，原生级性能）
  pdfrx: ^1.0.0

  # EPUB 渲染：WebView + foliate-js（与 dsh 版同一渲染引擎）
  #   为什么不用现成插件：
  #   - epub_viewer        2022 年停更，android/build.gradle 缺 namespace，AGP 8+ 失败
  #   - flutter_epub_viewer 依赖 inappwebview 且平台不含 Windows/Linux
  #   inappwebview 支持 android/ios/macos/windows/web（Linux 缺，见 README）
  flutter_inappwebview: ^6.1.5

  # 选择本地电子书文件（便于直接打开一本书，无需先建图书馆）
  # 用官方的 file_selector：file_picker 13.x 需要 Dart >=3.10（我们 3.9.2）
  file_selector: ^1.1.0

  # Markdown（设计文档 3.2：flutter_markdown）
  flutter_markdown: ^0.7.0

  # 本地数据库（设计文档 3.2：SQLite via drift）
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.0
  path: ^1.9.0

  # 状态管理（设计文档 3.2：Riverpod）
  flutter_riverpod: ^2.6.0

  # 网盘协议（设计文档 3.2：WebDAV + 百度网盘）
  http: ^1.2.0
  xml: ^6.5.0
  # 百度网盘分片上传需要计算分片 md5（设计文档 1.8.6）
  crypto: ^3.0.0

  # 手写标注（设计文档 3.2：scribe_canvas / 自研 CustomPainter）
  # scribe_canvas: ^0.1.0

  # 屏幕录制（设计文档 3.2 / 3.5）
  # desktop_screen_recorder: ^0.1.0

  # 平板端手写笔（压感 + 倾斜 + 手掌拒绝）
  # fluera_canvas: ^0.1.0

  # UI
  cupertino_icons: ^1.0.8
  window_manager: ^0.4.0
  video_player: ^2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.20.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    # foliate-js 渲染引擎（含 vendor 依赖），供 WebView 加载
    - assets/foliate/
    - assets/foliate/vendor/
