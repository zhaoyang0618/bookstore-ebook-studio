name: Build

# 多平台构建：GitHub 提供 macOS / Windows / Linux runner，
# 本地没有 Xcode 也能产出 macOS / iOS 安装包。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_targets:
        description: '构建目标（空格分隔：macos windows linux android ios）'
        required: false
        default: 'macos windows linux android ios'

jobs:
  # ---------- 先跑静态检查与测试，失败就不浪费各平台构建时间 ----------
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - name: 安装依赖
        run: flutter pub get
      - name: 静态检查
        run: flutter analyze --no-pub --no-fatal-infos
      - name: 单元测试
        run: flutter test --no-pub


  # ---------- 诊断：验证 runner 能否构建任意 Flutter Windows 应用 ----------
  diagnostic-windows:
    if: github.event_name == 'workflow_dispatch'
    # 必须用 2022 而非 latest：windows-latest 已升级到 Visual Studio 18，
    # 而 Flutter 3.35.5 的生成器映射只有 17 => 'VS 17 2022'，
    # VS 18 会落到默认分支 'VS 16 2019'，CMake 报
    # "Generator Visual Studio 16 2019 could not find any instance"
    runs-on: windows-2022
    steps:
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - name: 构建官方模板（排除我们代码的问题）
        shell: pwsh
        run: |
          flutter create --platforms=windows diag_app
          cd diag_app
          flutter build windows --release 2>&1 | Tee-Object -FilePath ..\diag.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content ..\diag.log -Tail 40 | ForEach-Object { Write-Host "::error::$_" }
            exit $LASTEXITCODE
          }
          Write-Host "官方模板构建成功"

  # ---------- macOS ----------
  build-macos:
    needs: check
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.build_targets, 'macos')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 构建 macOS（Release）
        run: flutter build macos --release
      - name: 打包 zip
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent "ebook_studio.app" "ebook_studio-macos.zip" || \
            ditto -c -k --sequesterRsrc --keepParent *.app "ebook_studio-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ebook_studio-macos
          path: build/macos/Build/Products/Release/*.zip
          retention-days: 14

  # ---------- Windows ----------
  build-windows:
    needs: check
    permissions:
      contents: write
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.build_targets, 'windows')
    # 必须用 2022 而非 latest：windows-latest 已升级到 Visual Studio 18，
    # 而 Flutter 3.35.5 的生成器映射只有 17 => 'VS 17 2022'，
    # VS 18 会落到默认分支 'VS 16 2019'，CMake 报
    # "Generator Visual Studio 16 2019 could not find any instance"
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - run: flutter pub get

      # pdfrx 在 Windows 上强制要求「开发者模式」——它用符号链接指向 PDFium 库，
      # 而 GitHub Actions 的 windows-latest 默认未开启该模式，CMake 会直接 FATAL_ERROR。
      # 这里通过注册表开启（runner 有管理员权限），随后重启资源管理器无效但符号链接权限即刻生效。
      - name: 启用 Windows 开发者模式（pdfrx 构建要求）
        shell: pwsh
        run: |
          $key = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock'
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
          New-ItemProperty -Path $key -Name AllowDevelopmentWithoutDevLicense `
            -Value 1 -PropertyType DWord -Force | Out-Null
          New-ItemProperty -Path $key -Name AllowAllTrustedApps `
            -Value 1 -PropertyType DWord -Force | Out-Null
          Get-ItemProperty -Path $key | Format-List
          # 验证符号链接能力
          $t = Join-Path $env:TEMP "symlink-test"
          Remove-Item -Recurse -Force $t -ErrorAction SilentlyContinue
          New-Item -ItemType SymbolicLink -Path $t -Target $env:TEMP -ErrorAction Stop | Out-Null
          Remove-Item -Force $t
          Write-Host "符号链接验证通过"

      - name: 构建 Windows（Release）
        shell: pwsh
        run: |
          flutter build windows --release --verbose 2>&1 | Tee-Object -FilePath build-windows.log
          if ($LASTEXITCODE -ne 0) {
            Write-Host "=== 构建失败，过滤关键错误行 ==="
            $lines = Get-Content build-windows.log
            # 用 GitHub 注解语法输出，运行摘要公开可读
            $lines | Select-String -Pattern 'error|Error|ERROR|FAILED|fatal|Fatal|exception|Exception|not found|Cannot' | Select-Object -First 40 | ForEach-Object {
              Write-Host "::error::$($_.Line.Trim())"
            }
            Write-Host "=== 最后 30 行 ==="
            $lines | Select-Object -Last 30 | ForEach-Object { Write-Host "::error::$_" }
            exit $LASTEXITCODE
          }

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build-windows.log
          retention-days: 7

      # artifact 下载需要认证，这里额外把日志尾部推到分支，
      # 使其可通过公开 API 读取（便于远程诊断）
      - name: 诊断：日志推到分支
        if: failure()
        shell: pwsh
        run: |
          Get-Content build-windows.log -Tail 300 | Set-Content windows-build-tail.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "ci-log-${{ github.run_id }}"
          git add -f windows-build-tail.log
          git commit -m "ci: windows build log (run ${{ github.run_id }})"
          git push origin "ci-log-${{ github.run_id }}"
      - name: 打包 zip
        shell: pwsh
        run: |
          $dir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $dir)) { $dir = "build\windows\runner\Release" }
          Compress-Archive -Path "$dir\*" -DestinationPath "ebook_studio-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ebook_studio-windows
          path: ebook_studio-windows.zip
          retention-days: 14

  # ---------- Linux ----------
  build-linux:
    needs: check
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.build_targets, 'linux')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 桌面构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 构建 Linux（Release）
        run: flutter build linux --release
      - name: 打包 tar.gz
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/ebook_studio-linux.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: ebook_studio-linux
          path: ebook_studio-linux.tar.gz
          retention-days: 14

  # ---------- Android（平板端） ----------
  build-android:
    needs: check
    permissions:
      contents: write
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.build_targets, 'android')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 构建 APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee android-build.log

      - name: 上传 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ebook_studio-android
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      - name: 失败时输出关键错误
        if: failure()
        run: |
          echo "=== 错误行 ==="
          grep -nE "error|Error|ERROR|FAILED|FAILURE|Exception|What went wrong|Could not|not found|requires" android-build.log | head -40 || true

      # 同 Windows：把日志推到分支，便于绕过 artifact 认证读取
      - name: 诊断：日志推到分支
        if: failure()
        run: |
          tail -300 android-build.log > android-build-tail.log || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "ci-log-${{ github.run_id }}"
          git add -f android-build-tail.log
          git commit -m "ci: android build log (run ${{ github.run_id }})" || true
          git push origin "ci-log-${{ github.run_id }}" || true

  # ---------- iOS（只出未签名 .app，真机需自签） ----------
  build-ios:
    needs: check
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.build_targets, 'ios')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 构建 iOS（未签名）
        run: flutter build ios --release --no-codesign
      - name: 打包
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent "Runner.app" "ebook_studio-ios-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ebook_studio-ios-unsigned
          path: build/ios/iphoneos/*.zip
          retention-days: 14

  # ---------- 发布：把各平台产物挂到 GitHub Release ----------
  # Actions 的 artifact 下载需要登录，Release 资产则公开可下载，
  # 因此打 tag 时自动创建 Release，方便直接分发给用户。
  release:
    needs: [build-macos, build-windows, build-linux, build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 列出产物
        run: find artifacts -type f | sort

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          name: ebook studio ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/ebook_studio-macos/*.zip
            artifacts/ebook_studio-windows/*.zip
            artifacts/ebook_studio-linux/*.tar.gz
            artifacts/ebook_studio-android/*.apk
            artifacts/ebook_studio-ios-unsigned/*.zip
