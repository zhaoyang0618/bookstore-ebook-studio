name: Build

# 多平台构建：GitHub 提供 macOS / Windows / Linux runner，
# 本地没有 Xcode 也能产出 macOS / iOS 安装包。
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      build_targets:
        description: '构建目标（空格分隔：macos windows linux android ios）'
        required: false
        default: 'macos windows linux'

jobs:
  # ---------- 先跑静态检查与测试，失败就不浪费各平台构建时间 ----------
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - name: 安装依赖
        run: flutter pub get
      - name: 静态检查
        run: flutter analyze --no-pub --no-fatal-infos
      - name: 单元测试
        run: flutter test --no-pub

  # ---------- macOS ----------
  build-macos:
    needs: check
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.build_targets, 'macos')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 构建 macOS（Release）
        run: flutter build macos --release
      - name: 打包 zip
        run: |
          cd build/macos/Build/Products/Release
          ditto -c -k --sequesterRsrc --keepParent "ebook_studio.app" "ebook_studio-macos.zip" || \
            ditto -c -k --sequesterRsrc --keepParent *.app "ebook_studio-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ebook_studio-macos
          path: build/macos/Build/Products/Release/*.zip
          retention-days: 14

  # ---------- Windows ----------
  build-windows:
    needs: check
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.build_targets, 'windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 构建 Windows（Release）
        run: flutter build windows --release
      - name: 打包 zip
        shell: pwsh
        run: |
          $dir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $dir)) { $dir = "build\windows\runner\Release" }
          Compress-Archive -Path "$dir\*" -DestinationPath "ebook_studio-windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ebook_studio-windows
          path: ebook_studio-windows.zip
          retention-days: 14

  # ---------- Linux ----------
  build-linux:
    needs: check
    if: >-
      github.event_name != 'workflow_dispatch' ||
      contains(github.event.inputs.build_targets, 'linux')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装 Linux 桌面构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 构建 Linux（Release）
        run: flutter build linux --release
      - name: 打包 tar.gz
        run: |
          cd build/linux/x64/release/bundle
          tar -czf "$GITHUB_WORKSPACE/ebook_studio-linux.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: ebook_studio-linux
          path: ebook_studio-linux.tar.gz
          retention-days: 14

  # ---------- Android（平板端） ----------
  build-android:
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' &&
      contains(github.event.inputs.build_targets, 'android')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 构建 APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ebook_studio-android
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  # ---------- iOS（只出未签名 .app，真机需自签） ----------
  build-ios:
    needs: check
    if: >-
      github.event_name == 'workflow_dispatch' &&
      contains(github.event.inputs.build_targets, 'ios')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: 构建 iOS（未签名）
        run: flutter build ios --release --no-codesign
      - name: 打包
        run: |
          cd build/ios/iphoneos
          ditto -c -k --sequesterRsrc --keepParent "Runner.app" "ebook_studio-ios-unsigned.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ebook_studio-ios-unsigned
          path: build/ios/iphoneos/*.zip
          retention-days: 14
